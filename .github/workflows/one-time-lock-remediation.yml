name: One-time dependency lock remediation

on:
  push:
    branches:
      - feature/dependency-security-hardening

permissions:
  contents: write

jobs:
  remediation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install current locked dependencies
        run: npm ci
      - name: Refresh packages within existing version ranges
        run: npm update --package-lock-only
      - name: Record known developer-tool advisories
        run: npm audit --audit-level=high || true
      - name: Enforce clean production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify updated lockfile install
        run: npm ci
      - name: Run tests and build
        run: |
          npm test
          npm run build
          npm run lint
      - name: Commit lockfile changes to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh vulnerable transitive npm dependencies"
            git push origin HEAD:feature/dependency-security-hardening
          fi
