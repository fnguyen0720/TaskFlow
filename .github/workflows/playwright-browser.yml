name: Playwright browser regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/playwright-browser.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/playwright-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Playwright test runner
        run: npm install --no-package-lock --ignore-scripts
        working-directory: frontend/e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend/e2e
      - name: Run isolated browser tests
        run: npm test
        working-directory: frontend/e2e
        env:
          CI: "true"
      - name: Upload failure screenshots, traces, and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-results
          path: |
            frontend/e2e/test-results/
            frontend/e2e/playwright-report/
          retention-days: 7
