name: Production smoke test (isolated account)

on:
  push:
    branches:
      - test/production-smoke-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install temporary browser tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke-test production using isolated account
        run: node scripts/productionSmoke.mjs
        env:
          SITE_URL: https://task-flow-pi-lake.vercel.app
          API_URL: https://taskflow-k63f.onrender.com
