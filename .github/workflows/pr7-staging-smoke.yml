name: PR7 isolated HTTP backend staging verification

on:
  push:
    branches:
      - test/pr7-backend-staging-20261118

permissions:
  contents: read

jobs:
  isolated-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build API and temporary staging database bootstrap
        run: dotnet build backend/TaskFlow.Api.StagingBootstrap/TaskFlow.Api.StagingBootstrap.csproj -c Release
      - name: Start PR7 API with isolated SQLite and run HTTP security checks
        shell: bash
        run: |
          set -euo pipefail
          db_path=$(mktemp /tmp/taskflow-pr7-XXXXXX.db)
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            rm -f "$db_path" "$db_path-shm" "$db_path-wal"
          }
          trap cleanup EXIT
          export ASPNETCORE_ENVIRONMENT=Production
          export DatabaseProvider=Sqlite
          export ConnectionStrings__DefaultConnection="Data Source=$db_path"
          export Cors__AllowedOrigins__1=https://trusted-preview.vercel.app
          export ASPNETCORE_URLS=http://127.0.0.1:5111

          dotnet run --project backend/TaskFlow.Api.StagingBootstrap --no-build -c Release -- "$db_path"
          dotnet run --project backend/TaskFlow.Api --no-build -c Release > /tmp/taskflow-pr7-api.log 2>&1 &
          server_pid=$!
          ready=0
          for i in $(seq 1 45); do
            code=$(curl --max-time 2 -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5111/api/tasks || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "API process exited unexpectedly"; cat /tmp/taskflow-pr7-api.log; exit 1
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "API did not become ready"; cat /tmp/taskflow-pr7-api.log; exit 1
          fi
          node backend/staging-smoke.mjs || {
            echo "Sanitized API log tail:"
            tail -n 80 /tmp/taskflow-pr7-api.log
            exit 1
          }
