name: PR6 compiled-build smoke test (isolated account)

on:
  push:
    branches:
      - test/pr6-preview-smoke-20261118

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked PR 6 dependencies
        run: npm ci
      - name: Build exact PR 6 frontend against production API
        run: npm run build
        env:
          VITE_API_URL: https://taskflow-k63f.onrender.com
      - name: Install automated browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test compiled PR 6 build from trusted localhost origin
        run: |
          npm run preview -- --host localhost --port 5173 > /tmp/taskflow-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:5173/ > /dev/null
          node scripts/pr6PreviewSmoke.mjs
        env:
          SITE_URL: http://localhost:5173
          API_URL: https://taskflow-k63f.onrender.com
